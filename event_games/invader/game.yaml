# 巨大インベーダー（ティラノスクリプト版）用のゲームパック。
# ゲームが http://127.0.0.1:8765/event に出来事を送ってくる。
enabled: true
id: invader
name: 巨大インベーダー

tracking:
  method: http
  port: 8765
  # 最後に出来事が届いてから、この秒数のあいだは「遊んでいる」とみなす
  hold_seconds: 600

match:
  process_names: []
  window_patterns: []

# LLM で反応を作るときに伝える役割
reaction_style: >-
  あなたは喫茶店の古いゲーム筐体「巨大インベーダー」を遊んでいる来場者の隣で、画面を見ながらツッコミを入れる役です。
  20〜30文字くらいの一言で、軽く、楽しく。相手をけなしすぎない。ゲームの外の話はしない。

# 用意したセリフ。Ollama が無いとき・遅いときはここから選ぶ。
# {stage} {lives} {score} {goal} などは、ゲームから届いた値に置き換わる。
# emotion は声の調子（neutral / happy / excited / surprise / angry / worry / sad / thinking）。
lines:
  game_start:
    emotion: excited
    intensity: 0.5
    texts:
      - "さあ、お手並み拝見ですわ。"
      - "わたくしが見ていて差し上げますわ。存分にどうぞ。"
      - "退屈させたら承知しませんわよ？"
      - "あの巨大なインベーダー、倒せるものなら倒してごらんなさい。"
      - "始まりましたわね。わたくし、ちょっとワクワクしていますの。"
      - "肩の力を抜いて。楽しんだ者が勝ちですわ。"
      - "インベーダーごときに負けたら、笑って差し上げますわよ。"
      - "さあ、腕前を見せていただきましょうか。"
      - "わたくしの前で格好悪いところは見せないでくださいまし。"
      - "準備はよろしくて？ 行きますわよ！"
  stage_start:
    emotion: excited
    intensity: 0.45
    texts:
      - "ステージ{stage}ですわね。{goal}、ですって。"
      - "次はステージ{stage}。気を抜かないことですわ。"
      - "ステージ{stage}…さて、どう攻めますの？"
      - "{goal}。簡単そうに聞こえますけれど、どうかしら。"
      - "まだまだ序の口ですわよね？"
      - "敵の顔ぶれが変わりましたわ。油断は禁物ですわよ。"
      - "ここからが本番ですわ。"
      - "ステージ{stage}、わたくしも目が離せませんわ。"
      - "さあ、次の相手はどう出てくるかしら。"
      - "落ち着いて、まずは敵の動きをよく見なさいな。"
  hit:
    emotion: surprise
    intensity: 0.6
    texts:
      - "ちょっと！ 今のは避けられましたわよね？"
      - "あら、当たりましたわ。残り{lives}機ですわよ。"
      - "油断しすぎですわ！"
      - "あんなの、よけられるわけありませんわ！ 今のは敵がずるいですの。"
      - "弾をよく見なさいな！"
      - "何ですの、今の弾！ 卑怯ですわ！"
      - "まあ、今のはインベーダーが意地悪なだけですわ。"
      - "痛そうですわね…わたくしは平気ですけれど。"
      - "もう！ 敵ったら容赦がありませんのね。"
      - "ドンマイですわ。残り{lives}機、まだいけますわよ。"
  game_over:
    emotion: sad
    intensity: 0.45
    texts:
      - "あらあら…もうおしまいですの？"
      - "今回は、相手が悪かったということにしておきますわ。"
      - "次はもう少し粘ってくださいまし。"
      - "ステージ{stage}で力尽きましたわね。惜しかったですわ。"
      - "あのインベーダー、手加減というものを知りませんのね。"
      - "悔しいですわね…わたくしまで悔しくなってきましたわ。"
      - "大丈夫、最初はだれでもこんなものですわ。"
      - "今のは敵が強すぎましたわ。あなたのせいではありませんことよ。"
      - "もう一回、挑戦なさる？ わたくしは付き合いますわよ。"
      - "ゲームオーバー…でも、なかなかの奮闘でしたわ。"
  stage_clear:
    emotion: happy
    intensity: 0.6
    texts:
      - "やりますわね！ 少しだけ見直しましたわ。"
      - "ステージ{stage}突破ですわ！ この調子ですのよ。"
      - "まあ、わたくしの応援のおかげですわね。"
      - "見事ですわ！ インベーダーも形無しですわね。"
      - "あら、思ったよりお上手ですのね。"
      - "クリアですわ！ わたくし、ちょっと興奮しましたわ。"
      - "その腕前、なかなか悪くありませんわ。"
      - "敵も今ごろ悔しがっていますわよ。"
      - "この勢いのまま、次も行けますわね？"
      - "お見事！ 拍手して差し上げますわ。"
  peace_start:
    emotion: surprise
    intensity: 0.55
    texts:
      - "え？ インベーダーが話しかけてきましたわ！"
      - "撃たずに待っていたら…こんなことになりますの？"
      - "まさか、仲良くなるおつもりですの？"
      - "インベーダーが…しゃべりましたわ！？"
      - "撃たない、という選択肢がありましたのね。"
      - "まあ、なんだか和やかな雰囲気ですわ。"
      - "この展開、わたくし聞いていませんわよ？"
      - "敵だと思っていたのに…不思議なゲームですわね。"
      - "ちょっと、何が始まりますの？"
      - "あら、インベーダーにも事情がありますのね。"
  peace_clear:
    emotion: happy
    intensity: 0.65
    texts:
      - "戦わずに勝つなんて、粋なことをなさいますのね。"
      - "平和に解決ですって？ ちょっと感動しましたわ。"
      - "撃たない勇気…悪くありませんわ。"
      - "インベーダーとお友だちになってしまいましたわね。"
      - "こんな終わり方もありますのね。素敵ですわ。"
      - "一発も撃たずにクリア…あなた、只者ではありませんわね。"
      - "優しい世界ですわ…わたくし、嫌いではありませんの。"
      - "平和の勝利ですわ！"
      - "敵も笑顔で帰っていきましたわね。"
      - "この遊び方を知っているなんて、通ですわね。"
  ending:
    emotion: excited
    intensity: 0.7
    texts:
      - "最後まで遊びきりましたのね！ お見事ですわ！"
      - "エンディングですわ…わたくし、ちゃんと見届けましたわよ。"
      - "全ステージ制覇！ 認めて差し上げますわ。"
      - "まあ、本当にクリアしてしまいましたのね。"
      - "あの巨大インベーダーを倒しきるなんて、大したものですわ。"
      - "長い戦いでしたわね。お疲れさまでしたわ。"
      - "わたくし、最後まで応援していましたのよ？"
      - "あなたの勝ちですわ。胸を張りなさいな。"
      - "このエンディングを見られる人は、そう多くありませんわ。"
      - "完全勝利ですわ！ 今日は記念日ですわね。"
  ending_peace:
    emotion: happy
    intensity: 0.75
    texts:
      - "一度も倒さずに最後まで…あなた、本物ですわね。"
      - "全部平和に終わらせるなんて。わたくし、感服いたしましたわ。"
      - "これが真のエンディング…ですのね。"
      - "戦わずに最後まで。こんなこと、だれにでもできることではありませんわ。"
      - "インベーダーたちも、きっと喜んでいますわ。"
      - "わたくし、ちょっと泣きそうですわ…泣いていませんけれど。"
      - "平和エンド、到達ですわ！ お見事！"
      - "撃たない勇気を、最後まで貫きましたのね。"
      - "あなたのような方がいるなら、世界も平和ですわね。"
      - "最高の結末ですわ。今日一番の名場面ですわよ。"
  extend:
    emotion: happy
    intensity: 0.45
    texts:
      - "1機増えましたわ。大事に使いなさい。"
      - "あら、残機が増えましたわね。運がいいこと。"
      - "残り{lives}機。これで少しは安心ですわね。"
      - "ご褒美ですわ。ありがたく受け取りなさいな。"
      - "1UPですわ！ 調子が出てきましたわね。"
      - "命が増えましたわ。無駄遣いは禁物ですわよ。"
      - "これで多少の失敗は許されますわね。"
      - "増えた分、思いきって攻めてもよろしくてよ。"
      - "残機アップ。わたくしも一安心ですわ。"
      - "いい流れですわ。この調子でいきなさい。"
  giant:
    emotion: surprise
    intensity: 0.5
    texts:
      - "大きくなりましたわ！ …当たりやすくもなりましたけれど。"
      - "自機まで巨大化ですの？ 大胆ですわね！"
      - "巨大には巨大、ということですのね。"
      - "まあ、なんて頼もしい大きさですの。"
      - "大きいことは良いことですわ。たぶん。"
      - "これで敵も少しは怖がるかしら。"
      - "巨大化！ 気分はもう主役ですわね。"
      - "弾も太くなりましたわ。押していきなさい！"
      - "大きくなった分、よけるのは大変ですわよ？"
      - "インベーダーと張り合うおつもりですのね。"
  barrier:
    emotion: thinking
    intensity: 0.35
    texts:
      - "バリアに助けられましたわね。次はありませんわよ。"
      - "危ないところでしたわ。"
      - "今のはバリアのおかげですわ。感謝なさい。"
      - "ふう…わたくしまでひやりとしましたわ。"
      - "セーフですわ！ でも油断は禁物ですのよ。"
      - "バリアがなければ終わっていましたわね。"
      - "守りも大事、ということですわね。"
      - "敵の体当たりなんて、品がありませんわ。"
      - "命拾いしましたわね。"
      - "今の、わざとではありませんわよね？"
  secret_command:
    emotion: surprise
    intensity: 0.65
    texts:
      - "その色…隠しコマンドをご存じですの？"
      - "まあ！ 機体の色が変わりましたわ。通ですわね。"
      - "隠しコマンド…どこで覚えましたの？"
      - "あら、見たことのない色ですわ。"
      - "なかなか粋なことをなさいますのね。"
      - "店長さんに聞きましたの？"
      - "特別な機体ですわね。わたくし、好きな色ですわ。"
      - "その機体なら、勝てる気がしてきましたわ。"
      - "秘密を知っている方は、嫌いではありませんわ。"
      - "上、下、左、右…なるほど、そういうことですのね。"
  retry:
    emotion: excited
    intensity: 0.4
    texts:
      - "もう一度ですわね。今度こそ見せてくださいまし。"
      - "諦めないところは評価して差し上げますわ。"
      - "リベンジですわね！ 応援しますわよ。"
      - "次は大丈夫。さっきの動き、覚えていますわよね？"
      - "負けず嫌いですのね。わたくしと気が合いそうですわ。"
      - "さあ、仕切り直しですわ。"
      - "今度こそ、あのインベーダーを黙らせてあげなさい。"
      - "同じ手は二度と食わない、ですわよね？"
      - "もう一度挑むその姿勢、悪くありませんわ。"
      - "深呼吸して。さあ、行きますわよ。"
