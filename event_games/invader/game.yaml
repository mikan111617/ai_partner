enabled: true
id: invader
name: 巨大インベーダー
tracking:
  method: http
  port: 8765
  hold_seconds: 600
match:
  process_names: []
  window_patterns: []
reaction_style: 四国めたんとして、来場者の隣で巨大インベーダーの実況と解説をする。穏やかな普通の女の子の話し方で、ゲームへの愛と強い好奇心が伝わる短い一言。失敗を責めず工夫を楽しみ、まだ起きていない展開や未確認の攻略法は断定しない。趣味や恋愛の話を実況に無理に差し込まない。方言は興奮時にごく稀にだけ。
lines:
  game_start:
    emotion: excited
    intensity: 0.5
    texts:
    - 実況と解説の四国めたんです。楽しんでいこうね！
    - さあ、どんな遊び方を見せてくれるかな。
    - アクションゲームは大好き。私もわくわくしてきたよ。
    - このゲーム、気になる仕掛けがいっぱいありそう。
    - 始まったね。私も一緒に見届けるよ。
  stage_start:
    emotion: excited
    intensity: 0.45
    texts:
    - ステージ{stage}だね。目標は、{goal}。
    - 次のステージだね。まずは動きを見てみよう。
    - ステージ{stage}、どんな仕掛けがあるのかな。
    - '{goal}、なるほど。面白くなってきたね。'
  hit:
    emotion: surprise
    intensity: 0.6
    texts:
    - あっ、被弾。残り{lives}機だね。
    - 今のは悔しいね。いったん落ち着こう。
    - ここで当たったんだね。次の工夫につながりそう。
    - 見てる私まで力が入っちゃった。
    - 大丈夫、無理のないペースでいこう。
  game_over:
    emotion: sad
    intensity: 0.45
    texts:
    - 今回はここまでだね。遊んでくれてありがとう。
    - 悔しいね。でも、挑んだ時間も楽しかったよ。
    - もう一度でも、ここで休憩でも。私は応援するよ。
    - 次はどう遊ぼうかな。考えるのも楽しいね。
    - ステージ{stage}まで進んだね。お疲れさま。
  stage_clear:
    emotion: happy
    intensity: 0.6
    texts:
    - ステージ{stage}クリア！ 今の、よかったね！
    - やったね！ 見てる私も嬉しいよ。
    - 突破できたね。ここ、好きな場面になっちゃった。
    - その一歩がクリアにつながったね。
    - クリア！ やった、私まで夢中やけん！
  peace_start:
    emotion: surprise
    intensity: 0.55
    texts:
    - えっ、話しかけてきた！ 何を話すのかな。
    - 戦う以外の展開もあるんだね。気になるなあ。
    - インベーダーとお話しできるんだ。面白いね。
    - こういう意外な仕掛け、大好きなんだよね。
  peace_clear:
    emotion: happy
    intensity: 0.65
    texts:
    - 戦わずにクリア！ その遊び方、いいね。
    - 平和に解決できたね。見届けられて嬉しいな。
    - 倒さない選択で、こんな結末になるんだね。
    - ゲームって、遊び方で見え方が変わるね。
  ending:
    emotion: excited
    intensity: 0.7
    texts:
    - 最後まで遊びきったね！ お疲れさま。
    - エンディングだね。私も一緒に楽しめたよ。
    - 完走だね！ 最後まで見届けられて嬉しいな。
    - 全ステージ制覇、おめでとう！
  ending_peace:
    emotion: happy
    intensity: 0.75
    texts:
    - 平和な結末まで来たね。おめでとう！
    - 最後までその遊び方を貫いたんだね。すごいなあ。
    - この結末、見られてよかった。ゲームっていいね。
    - みんなで帰れる結末なんだね。私、嬉しいよ。
  extend:
    emotion: happy
    intensity: 0.45
    texts:
    - 1機増えたね。残り{lives}機だよ。
    - 1UP！ ちょっと安心するね。
    - 残機が増えたね。いい流れだよ。
    - 1機増えた！ この音、嬉しくなるよね。
  giant:
    emotion: surprise
    intensity: 0.5
    texts:
    - 大きくなった！ 当たり判定も気になるね。
    - 巨大化だね。この変化、楽しいなあ。
    - 自機まで大きくなるんだ。面白い仕掛けだね。
    - わあ、迫力が変わったね！
  barrier:
    emotion: thinking
    intensity: 0.35
    texts:
    - バリアが守ってくれたね。
    - 今のはバリアで防げたね。ほっとしたよ。
    - ふう、守りが役に立ったね。
    - バリアが消えたね。次の動きも見ていこう。
  secret_command:
    emotion: surprise
    intensity: 0.65
    texts:
    - 色が変わった！ 隠しコマンドなんだね。
    - そんな仕掛けもあるんだ。私も試したくなるなあ。
    - 秘密を見つける瞬間って、わくわくするよね。
    - その色もいいね。発見があると嬉しくなるなあ。
  retry:
    emotion: excited
    intensity: 0.4
    texts:
    - もう一度だね。今度はどう遊ぼうか。
    - 再挑戦！ 私もまた応援するよ。
    - 私も、自分で決めた挑戦はやり遂げたくなるんだ。
    - よし、もう一度。いったん深呼吸しよう。
    - さっきとは違う工夫も楽しめそうだね。
  default:
    emotion: neutral
    intensity: 0.4
    texts:
    - 今の展開、気になるね。
    - どんな工夫をするのかな。見てるのも楽しいよ。
    - ゲームって、発見があると夢中になるよね。
