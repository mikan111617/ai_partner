# Copy this file to config.user.yaml when your local paths differ from config.yaml.
# config.user.yaml is ignored by Git.

microphone:
  # Leave blank to use the default input device.
  device: ""

voice:
  # Change this when Irodori-TTS is installed somewhere other than D:\Irodori-TTS.
  irodori_dir: 'D:\Irodori-TTS'
  # Optional reference WAV for the character voice.
  irodori_reference_audio: ''

vnyan:
  # VNyan is optional. Set true when using the VNyan integration.
  enabled: false
