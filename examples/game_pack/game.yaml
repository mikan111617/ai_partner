enabled: true
id: my_game
name: My Game

# How AI Partner knows this game is the active foreground application.
match:
  process_names:
    - game.exe
  # Use this when game.exe is too generic.
  process_path_contains:
    - '\\My Game\\'
  window_patterns: []

# For your own game, state_file is the most accurate method.
# For an existing game with a local scenario dump, change to screen_ocr.
tracking:
  method: state_file
  state_file: runtime_state.json
  interval_seconds: 0.9
  match_threshold: 0.64

scenario:
  enabled: true
  directory: scenario
  files:
    - '**/*.csv'
  # -1 means the last CSV column.
  csv_text_column: -1
  csv_speaker_column: 0
  csv_id_column: 1
  min_text_chars: 4

# Optional screen-text rules. These work especially well with tracking.method=screen_ocr.
# A matched rule describes a PLAYER event, so it can change respect/trust/etc.
gameplay_rules:
  - pattern: 'GAME OVER|敗北|戦闘不能'
    event_type: defeat
    actor_scope: user
    summary: プレイヤーが敗北した
    importance: 0.7
    cooldown_seconds: 10
    signals:
      player_defeated: 1.0
      heavy_damage: 0.4

  - pattern: 'VICTORY|勝利|戦闘に勝利'
    event_type: victory
    actor_scope: user
    summary: プレイヤーが戦闘に勝利した
    importance: 0.65
    cooldown_seconds: 8
    signals:
      victory: 1.0
