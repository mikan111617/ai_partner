enabled: true
id: my_game
name: My Game

# How AI Partner knows this game is the active foreground application.
match:
  process_names:
    - game.exe
  # Use this when game.exe is too generic.
  process_path_contains:
    - '\\My Game\\'
  window_patterns: []

# For your own or explicitly authorized game integration, state_file is the most accurate method.
# For a lawfully used existing game, screen_ocr can detect configured text events from the current screen.
tracking:
  method: state_file
  state_file: runtime_state.json
  interval_seconds: 0.9

# Optional rules used when tracking.method is screen_ocr.
# Rules react only to text currently visible on screen; no scenario file is loaded.
gameplay_rules:
  - pattern: 'GAME OVER|敗北|戦闘不能'
    event_type: defeat
    actor_scope: user
    summary: プレイヤーが敗北した
    importance: 0.7
    cooldown_seconds: 10
    signals:
      player_defeated: 1.0
      heavy_damage: 0.4

  - pattern: 'VICTORY|勝利|戦闘に勝利'
    event_type: victory
    actor_scope: user
    summary: プレイヤーが戦闘に勝利した
    importance: 0.65
    cooldown_seconds: 8
    signals:
      victory: 1.0
